# Serve a Capsium package behind Caddy via docker compose.
#
# Caddy auto-TLS (Let's Encrypt for real domains, internal CA for
# localhost). Reactor on port 9292; Caddy on 80/443.
#
# Run: docker compose up
# Test: curl -k https://localhost/

services:
  reactor:
    image: ruby:3.4
    working_dir: /pkg
    # Bind on 0.0.0.0 inside the container so Caddy can reach the
    # reactor from outside the Ruby process. The published 0.6.0 gem
    # binds to 0.0.0.0 by default (WEBrick default) but does NOT
    # accept --host yet (added post-0.6.0, not yet released).
    command: >
      bash -c "
      gem install capsium --no-document &&
      capsium reactor serve /pkg/capsium-package.cap --port 9292
      "
    volumes:
      - ./capsium-package.cap:/pkg/capsium-package.cap:ro
    ports:
      - "9292"

  caddy:
    build: .
    depends_on:
      - reactor
    ports:
      - "80:80"
      - "443:443"
