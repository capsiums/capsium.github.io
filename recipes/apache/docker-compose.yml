# Serve a Capsium package behind Apache httpd via docker compose.
#
# The reactor mounts a sample .cap from ./capsium-package.cap (drop
# your own there) and serves it on port 9292. Apache fronts on 443
# with TLS + reverse proxy.
#
# Run: docker compose up --build
# Test: curl -k https://localhost/

services:
  reactor:
    image: ruby:3.4
    working_dir: /pkg
    # Bind on 0.0.0.0 inside the container so Apache/Caddy can reach
    # the reactor from outside the Ruby process. The published 0.6.0
    # gem binds to 0.0.0.0 by default (WEBrick default) but does NOT
    # accept --host yet (added post-0.6.0, not yet released).
    command: >
      bash -c "
      gem install capsium --no-document &&
      capsium reactor serve /pkg/capsium-package.cap --port 9292
      "
    volumes:
      - ./capsium-package.cap:/pkg/capsium-package.cap:ro
    ports:
      - "9292"

  apache:
    build: .
    depends_on:
      - reactor
    ports:
      - "80:80"
      - "443:443"
