# Apache vhost configuration for serving a Capsium package via the
# capsium reactor. The reactor listens on http://reactor:9292; Apache
# terminates TLS on 443 and forwards.

<VirtualHost *:443>
    ServerName localhost

    # TLS — replace the self-signed cert with a real one in production.
    SSLEngine on
    SSLCertificateFile conf/server.crt
    SSLCertificateKeyFile conf/server.key

    # Proxy every request to the capsium reactor.
    ProxyPreserveHost On
    ProxyPass        / http://reactor:9292/
    ProxyPassReverse / http://reactor:9292/

    # Forward the original scheme so the reactor sees https:// when
    # generating absolute URLs (Location headers, introspection).
    RequestHeader set X-Forwarded-Proto "https"

    # Capsium reactor returns per-route Cache-Control; pass through.
    ProxyPassReverse / http://reactor:9292/

    # Standard access log tagged with the reactor's request_method.
    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# HTTP → HTTPS redirect on port 80.
<VirtualHost *:80>
    ServerName localhost
    RewriteEngine On
    RewriteRule ^/?(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>
