name: recipes

# Verifies the deployment recipes' container images build cleanly and
# the compose files are valid. The recipes themselves are config files
# (Apache vhost + Caddyfile); the end-to-end smoke (curl through the
# proxy) needs manual run locally with a real .cap dropped into the
# recipe directory — the README in each recipe documents how.
#
# Runs on every PR that touches recipes/ plus weekly on main.

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - '.github/workflows/recipes.yml'
  pull_request:
    paths:
      - 'recipes/**'
      - '.github/workflows/recipes.yml'
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        recipe: [apache, caddy]
    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose file
        working-directory: recipes/${{ matrix.recipe }}
        run: docker compose config >/dev/null

      - name: Build the proxy image
        working-directory: recipes/${{ matrix.recipe }}
        run: docker compose build
